name: CI

# Render deploys main only after this workflow passes (autoDeployTrigger:
# checksPass in render.yaml), so this is also the deploy gate.
on:
  push:
  pull_request:

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A throwaway Postgres for the API tests: no Supabase credentials in CI,
    # and every run starts from an empty database.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cast_ops_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cast_ops_ci
      DATABASE_SSL: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version # same version Render uses
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (server + client)
        run: npm run typecheck

      # Fails fast, with a clear error, if a migration doesn't apply to a fresh
      # database. The API tests then rebuild their own cast_ops_test schema.
      - name: Apply migrations
        run: npm run db:migrate

      - name: Test server (unit + API against Postgres)
        run: npm test -w server

      - name: Test client
        run: npm test -w client

      - name: Build (client + server)
        run: npm run build

      # Starts the production build exactly as Render does (minus migrations,
      # applied above) and checks the API and the served client answer.
      - name: Smoke test production build
        env:
          NODE_ENV: production
          PORT: "4000"
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4000/api/health > /dev/null 2>&1 && break
            sleep 1
          done
          set -x
          curl -fsS http://localhost:4000/api/health | grep -q '"database":"ok"'
          curl -fsS http://localhost:4000/ | grep -q '<div id="root">'
          curl -fsS http://localhost:4000/issues/1 | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/api/nope)" = "404"

      - name: Server log (on failure)
        if: failure()
        run: cat server.log || true
